[project]
name = "interviewer-voice"
version = "2.0.0"
description = "AI 模拟面试 - 实时语音 sidecar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets==13.1",
    "sounddevice==0.5.1",
    "numpy==2.2.1",
]

[project.scripts]
interviewer-voice = "voice.main:main"

[dependency-groups]
dev = [
    "pyinstaller==6.11.1",
    "ruff==0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
